name: Android build

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**']
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Backend API URL (ends with /api/v1/)'
        required: false

permissions:
  contents: write   # lets the workflow publish the APKs to the "android-latest" release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    env:
      API_URL: ${{ github.event.inputs.api_url || vars.CLASSNEX_API_URL || 'https://genusitsolution.com/ClassNex/api/v1/' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Firebase config (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "$GOOGLE_SERVICES_JSON" > app/google-services.json; echo "Firebase enabled"; else echo "No GOOGLE_SERVICES_JSON secret – push notifications disabled in this build"; fi

      - name: API contract unit tests (real server responses parsed by the app's models)
        run: ./gradlew --no-daemon testDebugUnitTest -PclassnexApiUrl="$API_URL"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-unit-test-report
          path: android/app/build/reports/tests/
          if-no-files-found: ignore

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug -PclassnexApiUrl="$API_URL"

      - uses: actions/upload-artifact@v4
        with:
          name: classnex-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Decode release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CLASSNEX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/classnex.jks"
            echo "path=$RUNNER_TEMP/classnex.jks" >> "$GITHUB_OUTPUT"
          else
            echo "No signing secrets – release build skipped (see docs/ANDROID.md)"
          fi

      - name: Build signed release APK + AAB
        if: steps.keystore.outputs.path != ''
        env:
          CLASSNEX_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          CLASSNEX_KEYSTORE_PASSWORD: ${{ secrets.CLASSNEX_KEYSTORE_PASSWORD }}
          CLASSNEX_KEY_ALIAS: ${{ secrets.CLASSNEX_KEY_ALIAS }}
          CLASSNEX_KEY_PASSWORD: ${{ secrets.CLASSNEX_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease -PclassnexApiUrl="$API_URL"

      - name: Build unsigned release APK + AAB (verifies R8 / release config)
        if: steps.keystore.outputs.path == ''
        run: ./gradlew --no-daemon assembleRelease bundleRelease -PclassnexApiUrl="$API_URL"

      - uses: actions/upload-artifact@v4
        if: steps.keystore.outputs.path == ''
        with:
          name: classnex-release-unsigned
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab

      - uses: actions/upload-artifact@v4
        if: steps.keystore.outputs.path != ''
        with:
          name: classnex-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab

      # Download link that does not expire: Releases → android-latest (debug APK + release APK/AAB).
      - name: Publish APK / AAB to the android-latest release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Built automatically from commit ${GITHUB_SHA::7} on $(date -u +'%Y-%m-%d %H:%M UTC'). API: $API_URL. The debug APK installs directly; the release APK/AAB are unsigned unless signing secrets are configured (see docs/ANDROID.md)."
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --prerelease --title "ClassNex Android – latest build" --notes "$NOTES" --target "$GITHUB_SHA"
          gh release edit android-latest --notes "$NOTES"
          cp app/build/outputs/apk/debug/*.apk "$RUNNER_TEMP/ClassNex-debug.apk"
          FILES="$RUNNER_TEMP/ClassNex-debug.apk"
          for f in app/build/outputs/apk/release/*.apk; do [ -f "$f" ] && cp "$f" "$RUNNER_TEMP/ClassNex-release.apk" && FILES="$FILES $RUNNER_TEMP/ClassNex-release.apk"; done
          for f in app/build/outputs/bundle/release/*.aab; do [ -f "$f" ] && cp "$f" "$RUNNER_TEMP/ClassNex-release.aab" && FILES="$FILES $RUNNER_TEMP/ClassNex-release.aab"; done
          # keep the previous build: 1.0.21 was only on android-latest, so save it once under its own release
          if ! gh release view android-v1.0.21 >/dev/null 2>&1 && gh release view android-latest >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/prev" && gh release download android-latest -D "$RUNNER_TEMP/prev" -p "*.apk" -p "*.aab" || true
            gh release create android-v1.0.21 --prerelease --title "ClassNex Android 1.0.21" --notes "Previous build (1.0.21, commit a79cad3), kept unchanged. Not deployed." --target a79cad37619ffc262cbac6e467e314bd19462465 "$RUNNER_TEMP"/prev/* || true
          fi
          VER=$(grep -o 'versionName = System.getenv("CLASSNEX_VERSION_NAME") ?: "[0-9.]*"' app/build.gradle.kts | grep -o '[0-9][0-9.]*')
          # every version gets its own release; android-latest always points to the newest
          gh release view "android-v$VER" >/dev/null 2>&1 || gh release create "android-v$VER" --prerelease --title "ClassNex Android $VER" --notes "$NOTES" --target "$GITHUB_SHA"
          gh release edit "android-v$VER" --notes "$NOTES"
          gh release upload "android-v$VER" $FILES --clobber
          gh release upload android-latest $FILES --clobber
